name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify calculations and artifact integrity
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python scripts
        run: python -m compileall -q scripts
      - name: Verify manuscript calculations
        run: python scripts/verify_calculations.py
      - name: Verify artifact checksums (cross-platform, byte-exact)
        run: python scripts/verify_artifacts.py

  build-paper:
    name: Build LaTeX manuscript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
      - name: Reject undefined references and large overfull boxes
        shell: bash
        run: |
          LOG=$(ls build/main.log main.log 2>/dev/null | head -n1)
          echo "Checking $LOG"
          if grep -E "(undefined references|Reference .* undefined|Citation .* undefined)" "$LOG"; then
            echo "::error::Undefined references or citations."
            exit 1
          fi
          BAD=$(grep -E "Overfull \\\\hbox \(([2-9][0-9]|[0-9]{3,})(\.[0-9]+)?pt" "$LOG" || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::Overfull hbox exceeding 20pt."
            exit 1
          fi
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: |
            build/main.pdf
            main.pdf
          if-no-files-found: error
