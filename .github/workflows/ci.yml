name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify calculations and artifact integrity
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification dependencies (pinned)
        run: python -m pip install -q -r requirements-ci.txt
      - name: Compile all Python scripts
        run: python -m compileall -q scripts
      - name: Verify manuscript calculations
        run: python scripts/verify_calculations.py
      - name: Verify artifact checksums (cross-platform, byte-exact)
        run: python scripts/verify_artifacts.py
      - name: Verify manuscript figures match the archived artifacts
        run: python scripts/make_figures.py --check
      - name: Evidence-contract schema, hash-locking, and aggregation tests
        run: python scripts/test_evidence_contract.py
      - name: CHUBE reference implementation tests (prospective research track)
        run: python scripts/test_chube_reference.py
      - name: Validate evidence contracts
        run: python scripts/evidence_contract.py validate examples/tfim-evidence-contract.yaml
      - name: Verify protocol seal (if sealed)
        shell: bash
        run: |
          if [ -f specs/protocol-seal.json ]; then
            python scripts/evidence_contract.py verify-seal
          else
            echo "No protocol seal yet; skipping."
          fi

  build-paper:
    name: Build LaTeX manuscript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
      - name: Reject undefined references and large overfull boxes
        shell: bash
        run: |
          LOG=build/main.log
          [ -f "$LOG" ] || LOG=main.log
          [ -f "$LOG" ] || { echo "::error::No LaTeX log found."; exit 1; }
          echo "Checking $LOG"
          if grep -E "(undefined references|Reference .* undefined|Citation .* undefined)" "$LOG"; then
            echo "::error::Undefined references or citations."
            exit 1
          fi
          BAD=$(grep -E "Overfull \\\\hbox \(([2-9][0-9]|[0-9]{3,})(\.[0-9]+)?pt" "$LOG" || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::Overfull hbox exceeding 20pt."
            exit 1
          fi
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: |
            build/main.pdf
            main.pdf
          if-no-files-found: error
